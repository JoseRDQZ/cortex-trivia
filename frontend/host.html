<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cortex Trivia — Host</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <h1 class="brand">Cortex Trivia</h1>
      <div class="row">
        <span class="pill">Host</span>
        <a class="pill" href="./index.html">Lobby</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <div class="big">Host Dashboard</div>
          <div class="muted">Manage the session, start the game, and monitor players.</div>
        </div>
        <button id="hostBackBtn" class="btn danger">Back to Lobby</button>
      </div>

      <div class="divider"></div>

      <div class="panel">
        <div class="row">
          <div>
            <div class="label">SESSION CODE</div>
            <div id="hostSessionCode" class="mono" style="font-size:18px;">—</div>
          </div>

          <div style="margin-left:auto;">
            <div class="label">CATEGORY (BANK)</div>
            <div id="hostBank" class="mono">—</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="panel">
          <div class="label">QUESTION TIMER</div>
          <div class="row">
            <button class="btn timer-btn" data-time="15">15s</button>
            <button class="btn timer-btn" data-time="30">30s</button>
            <button class="btn timer-btn" data-time="45">45s</button>
            <button class="btn timer-btn" data-time="60">60s</button>
          </div>

          <div class="divider"></div>

          <div class="label">BUFFER TIMER</div>
          <div class="row">
            <button id="bufferOn" class="btn">ON</button>
            <button id="bufferOff" class="btn">OFF</button>
          </div>
        </div>

        <div class="row right">
          <button id="copyCodeBtn" class="btn primary">Copy Code</button>
          <button id="hostStartBtn" class="btn primary">Start Game</button>
        </div>

        <div id="hostStatus" class="status">Waiting…</div>
      </div>

      <div class="divider"></div>

      <div class="panel">
        <div class="row">
          <div class="label">PLAYERS</div>
        </div>
        <div id="hostPlayers" class="mono muted">No players loaded yet.</div>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
