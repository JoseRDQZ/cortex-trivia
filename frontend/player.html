<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cortex Trivia — Player</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="player">
  <header class="header">
    <div class="container header__inner">
      <h1 class="brand">Cortex Trivia</h1>
      <div class="row">
        <span class="pill" style="border-color:var(--primary); color:var(--primary);">Player</span>
        <a class="pill" href="./index.html">Lobby</a>
        <span class="pill">New Theme</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Quick player guidance: no JS dependency -->
    <section class="card" style="margin-top:12px;">
      <div class="row" style="justify-content:space-between; align-items:flex-start;">
        <div>
          <div class="label muted">Player tips</div>
          <p class="muted" style="margin:4px 0 0;">
            Stay on this page until the host starts. You’ll jump into the quiz when it’s ready.
          </p>
        </div>
        <div class="row" style="gap:8px;">
          <span class="pill">Fast answers = more points</span>
          <span class="pill">Keep code handy</span>
        </div>
      </div>
    </section>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <div class="big">Player Lobby</div>
          <div class="muted">You’re joined — wait for the host to start.</div>
        </div>
        <button id="playerBackBtn" class="btn danger">Back to Lobby</button>
      </div>

      <div class="divider"></div>

      <div class="panel">
        <div class="row">
          <div>
            <div class="label">SESSION CODE</div>
            <div id="playerSessionCode" class="mono" style="font-size:18px;">—</div>
          </div>

          <div style="margin-left:auto;">
            <div class="label">PLAYER</div>
            <div id="playerName" class="mono">—</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="row right">
          <button id="playerCheckBtn" class="btn primary">Check Game Status</button>
          <button id="playerOpenQuizBtn" class="btn primary" disabled>Open Quiz</button>
        </div>

        <div id="playerStatus" class="status">Waiting…</div>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
